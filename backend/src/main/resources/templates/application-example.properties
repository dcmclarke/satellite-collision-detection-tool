spring.application.name=Satellite Collision Detection

spring.datasource.url=jdbc:postgresql://localhost:5432/satellitedb
spring.datasource.username=postgres
spring.datasource.password=CHANGE_ME_TO_DB_PASSWORD

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spacetrack.api.username=CHANGE_ME_TO_SPACETRACK_USERNAME
spacetrack.api.password=CHANGE_ME_TO_SPACETRACK_PASSWORD
spacetrack.api.url=https://www.space-track.org
#Space-Track asks for GP data at most once an hour; the API refuses fetches more often than this
spacetrack.api.min-fetch-interval=1h
