spring.application.name=Satellite Collision Detection

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/satellitedb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

spacetrack.api.username=${SPACETRACK_API_USERNAME:}
spacetrack.api.password=${SPACETRACK_API_PASSWORD:}
spacetrack.api.url=${SPACETRACK_API_URL:https://www.space-track.org}
#Space-Track asks for GP data at most once an hour; the API refuses fetches more often than this
spacetrack.api.min-fetch-interval=${SPACETRACK_API_MIN_FETCH_INTERVAL:1h}

#the endpoints that replace data have no login, so they are off by default
#run with the 'dev' profile (application-dev.properties) to turn them on locally
app.manual-data-refresh.enabled=${APP_MANUAL_DATA_REFRESH_ENABLED:false}

server.port=${PORT:8080}